env:
  - GO111MODULE=on
  - CGO_ENABLED=1
before:
  hooks:
    - go mod tidy
gomod:
  proxy: false
builds:
  - id: linux
    ldflags:
      - '-s -w -extldflags "-static"'
    flags:
      - "-a"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: darwin
    ldflags:
      - '-s -w'
    flags:
      - "-a"
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: windows
    ldflags:
      - '-s -w'
    flags:
      - "-a"
    goos:
      - windows
    goarch:
      - amd64
    mod_timestamp: "{{ .CommitTimestamp }}"
universal_binaries:
  - name_template: "{{ .ProjectName }}_{{.Version}}"
    # IDs to use to filter the built binaries.
    #
    # Default: the value of the id field
    ids:
      - darwin

    # Whether to remove the previous single-arch binaries from the artifact list.
    # If left as false, your end release might have both several macOS archives:
    # amd64, arm64 and all.
    #
    # Defaults to false.
    replace: false
checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
archives:
  - name_template: '{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    format_overrides:
    - goos: windows
      format: zip
    files:
      - README.md
